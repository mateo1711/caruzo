<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Caruzo · Banned</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--danger:#ff315f;--text:#f8f8fb;--muted:#8b8c95;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}html{color-scheme:dark;background:var(--bg)}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:#050507;color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(800px 480px at 50% 45%,rgba(255,49,95,.13),transparent 64%),radial-gradient(500px 300px at 25% 15%,rgba(139,92,246,.09),transparent 70%),#050507;animation:drift 12s ease-in-out infinite alternate}body:after{content:"";position:fixed;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at center,black,transparent 78%)}@keyframes drift{to{transform:translate3d(2.5%,-1.5%,0) scale(1.03)}}.noise{position:fixed;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.28) 4px);animation:scan 7s linear infinite}@keyframes scan{to{transform:translateY(32px)}}.wrap{position:relative;z-index:2;width:min(720px,calc(100vw - 28px));text-align:center}.mark{position:relative;width:126px;height:126px;margin:0 auto 26px;display:grid;place-items:center}.mark:before,.mark:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1)}.mark:before{inset:0;border-top-color:var(--danger);box-shadow:0 0 42px rgba(255,49,95,.17);animation:spin 8s linear infinite}.mark:after{inset:14px;border-bottom-color:rgba(255,49,95,.62);animation:spin 5s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.shield{width:72px;height:72px;border-radius:20px;background:linear-gradient(145deg,rgba(255,49,95,.18),rgba(255,255,255,.025));border:1px solid rgba(255,49,95,.34);display:grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.06),0 0 38px rgba(255,49,95,.12);font:800 28px JetBrains Mono,monospace;color:#ff557a;animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.045);box-shadow:inset 0 1px rgba(255,255,255,.08),0 0 58px rgba(255,49,95,.22)}}.card{position:relative;padding:38px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(14,14,18,.86),rgba(7,7,10,.78));backdrop-filter:blur(28px) saturate(125%);box-shadow:0 34px 100px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.035);overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,49,95,.07) 48%,transparent 62%);transform:translateX(-120%);animation:sheen 4.6s ease-in-out infinite;pointer-events:none}@keyframes sheen{60%,100%{transform:translateX(120%)}}.eyebrow{font:800 10px/1 JetBrains Mono,monospace;letter-spacing:.2em;text-transform:uppercase;color:#ff6b8b;margin-bottom:12px}h1{margin:0;font-size:clamp(34px,7vw,72px);letter-spacing:-.055em;line-height:.95}.glitch{position:relative;text-shadow:0 0 26px rgba(255,49,95,.14)}.glitch:before,.glitch:after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:.22}.glitch:before{color:#6cf;transform:translateX(-2px);clip-path:inset(0 0 58% 0);animation:gl1 3.1s steps(1) infinite}.glitch:after{color:#f36;transform:translateX(2px);clip-path:inset(58% 0 0 0);animation:gl2 2.7s steps(1) infinite}@keyframes gl1{0%,92%,100%{transform:translateX(-2px)}94%{transform:translateX(5px)}96%{transform:translateX(-6px)}}@keyframes gl2{0%,88%,100%{transform:translateX(2px)}90%{transform:translateX(-5px)}92%{transform:translateX(7px)}}p{margin:18px auto 0;max-width:520px;color:var(--muted)}.reason{margin:22px auto 0;padding:14px 16px;max-width:520px;border:1px solid rgba(255,49,95,.18);border-radius:12px;background:rgba(255,49,95,.055);color:#d7d7dd;text-align:left}.reason b{display:block;margin-bottom:5px;color:#ff718f;font:800 10px JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase}.actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);color:#ddd;font-weight:700;text-decoration:none;transition:.2s}.btn:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}.btn.danger{border-color:rgba(255,49,95,.28);color:#ff7b97}.foot{margin-top:18px;color:#55565e;font:700 10px JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head><body><div class="noise"></div><main class="wrap"><div class="mark"><div class="shield">×</div></div><section class="card"><div class="eyebrow">Access denied · 403</div><h1 class="glitch" data-text="DU BIST BANNED">DU BIST BANNED</h1><p>Dieser Account wurde für Caruzo gesperrt. Profil-Editor und geschützte Bereiche sind nicht verfügbar.</p><div class="reason" id="reason" hidden><b>Grund</b><span id="reasonText"></span></div><div class="actions"><a class="btn danger" href="/logout">Abmelden</a></div><div class="foot">CARUZO · MODERATION SYSTEM</div></section></main><script>fetch('/api/ban-info').then(r=>r.json()).then(x=>{if(x.banned&&x.reason){document.getElementById('reason').hidden=false;document.getElementById('reasonText').textContent=x.reason}}).catch(()=>{});</script></body></html>
