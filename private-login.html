<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caruzo · Invite Access</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<script src="/site-bg.js"></script>
<style>
:root{--accent:#8b5cf6;--bg:#050507;--text:#f7f7fa;--muted:#878892;--line:rgba(255,255,255,.105)}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:#050507;color:var(--text);font:14px/1.45 'Inter',system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 15% 10%,rgba(255,126,65,.16),transparent 68%),radial-gradient(680px 520px at 82% 18%,rgba(139,92,246,.23),transparent 65%),radial-gradient(680px 500px at 65% 95%,rgba(236,72,153,.17),transparent 67%),#050507}
body:after{content:"";position:fixed;inset:0;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(circle at center,black,transparent 80%)}
.orb{position:fixed;width:420px;height:180px;border-radius:999px;filter:blur(72px);opacity:.18;pointer-events:none;animation:drift 12s ease-in-out infinite alternate}.orb.a{left:-100px;top:24%;background:#ff814a;transform:rotate(18deg)}.orb.b{right:-120px;top:34%;background:#8b5cf6;animation-delay:-4s}.orb.c{right:20%;bottom:-80px;background:#ec4899;animation-delay:-8s}@keyframes drift{to{transform:translate3d(45px,-22px,0) rotate(-8deg)}}
.wrap{position:relative;z-index:2;width:min(430px,calc(100vw - 28px))}.logoStage{display:grid;place-items:center;margin-bottom:22px}.rings{position:relative;width:108px;height:108px;display:grid;place-items:center}.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.13)}.rings:before{inset:0;animation:spin 9s linear infinite;border-top-color:rgba(139,92,246,.9);box-shadow:0 0 28px rgba(139,92,246,.13)}.rings:after{inset:12px;animation:spin 6s linear infinite reverse;border-right-color:rgba(236,72,153,.85)}@keyframes spin{to{transform:rotate(360deg)}}
.logo{position:relative;width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(139,92,246,.35));animation:logoPulse 2.8s ease-in-out infinite}@keyframes logoPulse{50%{transform:scale(1.055);filter:drop-shadow(0 0 30px rgba(139,92,246,.55))}}
.card{position:relative;padding:27px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(15,15,20,.82),rgba(7,7,10,.76));backdrop-filter:blur(28px) saturate(125%);box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.035);overflow:hidden}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 38%,rgba(255,255,255,.035) 50%,transparent 62%);transform:translateX(-120%);animation:sheen 5s ease-in-out infinite}@keyframes sheen{55%,100%{transform:translateX(120%)}}
.eyebrow{font:800 10px/1 'JetBrains Mono',monospace;letter-spacing:.17em;text-transform:uppercase;color:#858690;margin-bottom:10px}.titleRow{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{margin:0;font-size:26px;letter-spacing:-.035em}.lock{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.035);color:#b8b8c1}p{margin:8px 0 21px;color:var(--muted);font-size:13px}
.field{position:relative}.field input{width:100%;height:50px;border:1px solid rgba(255,255,255,.085);border-radius:12px;background:rgba(0,0,0,.27);color:#fff;padding:0 46px 0 14px;font:600 14px 'JetBrains Mono',monospace;outline:0;transition:.2s}.field input:focus{border-color:rgba(139,92,246,.62);box-shadow:0 0 0 4px rgba(139,92,246,.095),0 0 28px rgba(139,92,246,.08)}.peek{position:absolute;right:7px;top:7px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#757680;cursor:pointer}.peek:hover{background:rgba(255,255,255,.05);color:#fff}.submit{width:100%;height:49px;margin-top:11px;border:1px solid #fff;border-radius:12px;background:#f4f4f5;color:#08080b;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 12px 34px rgba(255,255,255,.06)}.submit:hover{transform:translateY(-1px);background:#fff}.submit:disabled{opacity:.6;cursor:wait;transform:none}.error{min-height:18px;margin-top:11px;color:#ff7b9b;font-size:12px}.foot{margin-top:13px;text-align:center;color:#5f6068;font-size:11px}.foot b{color:#888993;font-weight:600}
.keyState{min-height:18px;margin:8px 2px -2px;color:#777985;font-size:11px}.keyState.ok{color:#58e69a}.keyState.bad{color:#ff7b9b}.existing{display:flex;align-items:center;justify-content:center;width:100%;height:44px;margin-top:9px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025);color:#8e8f98;text-decoration:none;font-size:12px;font-weight:600;transition:.2s}.existing:hover{background:rgba(255,255,255,.055);color:#fff}.existing b{margin-left:4px;color:#cfd0d6}.field input{text-transform:uppercase;letter-spacing:.035em}.field input::placeholder{text-transform:none;letter-spacing:0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
body.has-bg:before,body.has-bg:after,body.has-bg .orb{opacity:0!important}
</style>
<link rel="icon" href="/caruzo-logo.png" type="image/png">
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<main class="wrap">
  <div class="logoStage"><div class="rings"><img class="logo" src="/caruzo-logo.png" alt="Caruzo"></div></div>
  <form class="card" id="form">
    <div class="eyebrow">Invite access</div>
    <div class="titleRow"><h1>Invite erforderlich.</h1><div class="lock">⌁</div></div>
    <p>Neue Accounts können mit einem gültigen Invite Key erstellt werden. Jeder Invite Key ist nur einmal verwendbar.</p>
    <div class="field"><input id="invite" type="text" autocomplete="off" spellcheck="false" placeholder="CRZ-XXXX-XXXX-XXXX" autofocus required><button class="peek" id="paste" type="button" aria-label="Invite Key einfügen">⌁</button></div>
    <div class="keyState" id="keyState"></div>
    <button class="submit" id="submit">Invite öffnen</button>
    <a class="existing" href="/auth/discord">Bereits registriert? <b>Mit Discord anmelden</b></a>
    <div class="error" id="error" role="status"></div>
    <div class="foot">Invite only · <b>caruzo.lol/login</b></div>
  </form>
</main>
<script>
window.CaruzoBG&&CaruzoBG.mount('login');
const form=document.getElementById('form'),key=document.getElementById('invite'),error=document.getElementById('error'),submit=document.getElementById('submit'),state=document.getElementById('keyState');
const params=new URLSearchParams(location.search);if(params.get('error')==='invite-required')error.textContent='Für einen neuen Account brauchst du zuerst einen gültigen Invite Key.';
document.getElementById('paste').onclick=async()=>{try{key.value=(await navigator.clipboard.readText()).trim();key.dispatchEvent(new Event('input'))}catch{key.focus()}};
let timer=0;key.oninput=()=>{clearTimeout(timer);state.textContent='';state.className='keyState';const value=key.value.trim();if(!value)return;timer=setTimeout(async()=>{if(!/^CRZ-/i.test(value)){state.textContent='Owner-Zugang oder Invite Key eingeben.';return}try{const r=await fetch('/api/invite/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:value})});const j=await r.json();if(j.status==='valid'){state.textContent='Invite Key ist gültig.';state.className='keyState ok'}else if(j.status==='redeemed'){state.textContent='Dieser Key wurde bereits eingelöst.';state.className='keyState bad'}else if(j.status==='revoked'){state.textContent='Dieser Key wurde deaktiviert.';state.className='keyState bad'}else{state.textContent='Invite Key nicht gefunden.';state.className='keyState bad'}}catch{}},280)};
form.onsubmit=async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='Prüfe Invite …';try{const r=await fetch('/api/invite-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key.value})});const data=await r.json().catch(()=>({}));if(r.ok){submit.textContent='Zugriff bestätigt';location.href='/'}else{error.textContent=data.error||'Invite konnte nicht geprüft werden.';key.select();submit.disabled=false;submit.textContent='Invite öffnen'}}catch{error.textContent='Verbindung fehlgeschlagen.';submit.disabled=false;submit.textContent='Invite öffnen'}};
</script>
</body>
</html>
