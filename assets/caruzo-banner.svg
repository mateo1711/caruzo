<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0b14"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#06b6d4" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="30" fill="url(#bg)"/>

  <circle cx="110" cy="60" r="3" fill="#8b5cf6">
    <animate attributeName="cy" values="60;195;60" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="180" r="4" fill="#06b6d4">
    <animate attributeName="cy" values="180;50;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;1;.3" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="90" y="56" width="1020" height="148" rx="28" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".75">
    <animate attributeName="opacity" values=".35;.95;.35" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="135" text-anchor="middle" fill="url(#neon)"
        font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800"
        letter-spacing="5" filter="url(#glow)">CARUZO.LOL</text>

  <text x="600" y="172" text-anchor="middle" fill="#cbd5e1"
        font-family="Arial, Helvetica, sans-serif" font-size="17"
        letter-spacing="2">YOUR PROFILE · YOUR STYLE · YOUR IDENTITY</text>
</svg>
