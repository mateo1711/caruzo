<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · Caruzo</title>
<link rel="icon" href="/caruzo-logo.png" type="image/png">
<style>
:root{--a:#00e676;--b:#7c3aed;--bg:#050608;--panel:rgba(16,18,21,.78);--line:rgba(255,255,255,.10);--grid:rgba(255,255,255,.025);--radius:24px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f4f4f6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 520px at 20% 10%,color-mix(in srgb,var(--a) 13%,transparent),transparent 62%),radial-gradient(760px 500px at 85% 85%,color-mix(in srgb,var(--b) 13%,transparent),transparent 60%),var(--bg);transition:background .35s ease}.grid{position:fixed;inset:-30%;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:42px 42px;transform:perspective(700px) rotateX(64deg) translateY(22%);mask-image:linear-gradient(to bottom,transparent 8%,#000 45%,transparent 90%);animation:gridMove 12s linear infinite}.orb{position:fixed;width:460px;height:460px;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none}.o1{background:var(--a);left:-150px;top:-170px;animation:float1 10s ease-in-out infinite alternate}.o2{background:var(--b);right:-150px;bottom:-170px;animation:float2 12s ease-in-out infinite alternate}.card{position:relative;width:min(680px,calc(100vw - 34px));padding:48px 42px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:0 32px 100px rgba(0,0,0,.58),0 0 70px color-mix(in srgb,var(--a) 8%,transparent);backdrop-filter:blur(26px) saturate(145%);text-align:center;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 38%,rgba(255,255,255,.045) 48%,transparent 58%);transform:translateX(-130%);animation:shine 4.8s ease-in-out infinite}.logo{width:58px;height:58px;border-radius:17px;object-fit:cover;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--a) 28%,transparent));animation:logoFloat 3.6s ease-in-out infinite}.code{position:relative;margin:24px 0 4px;font-size:clamp(72px,16vw,132px);font-weight:900;letter-spacing:-.085em;line-height:.85;background:linear-gradient(180deg,#fff,#777);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 42px rgba(255,255,255,.06)}.code:after{content:"404";position:absolute;inset:0;color:var(--a);opacity:.13;transform:translate(3px,1px);clip-path:polygon(0 42%,100% 38%,100% 52%,0 56%);animation:glitch 2.4s steps(1) infinite}h1{font-size:24px;margin:12px 0 8px;letter-spacing:-.035em}p{margin:0 auto;color:#8e929a;max-width:480px;line-height:1.65;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{height:44px;padding:0 17px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:#dfe2e7;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:13px;transition:.2s}.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.18)}.btn.primary{background:var(--a);border-color:transparent;color:#03120a;box-shadow:0 0 34px color-mix(in srgb,var(--a) 18%,transparent)}.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--a) 72%,transparent),transparent);top:12%;animation:scan 4s linear infinite;opacity:.5}
body[data-design="2"]{--a:#8b5cf6;--b:#ec4899;--bg:#06050a;--panel:linear-gradient(145deg,rgba(19,13,30,.84),rgba(8,7,12,.74));--radius:28px}
body[data-design="3"]{--a:#22d3ee;--b:#3b82f6;--bg:#031014;--panel:rgba(3,15,19,.82);--grid:rgba(34,211,238,.045);--radius:12px}
body[data-design="4"]{--a:#ff2e93;--b:#8b5cf6;--bg:#0b0509;--panel:linear-gradient(160deg,rgba(31,8,21,.84),rgba(8,6,11,.78));--radius:18px}
body[data-design="5"]{--a:#f59e0b;--b:#ef4444;--bg:#100b04;--panel:rgba(24,15,6,.80);--grid:rgba(245,158,11,.04);--radius:20px}
body[data-design="6"]{--a:#f4f4f5;--b:#71717a;--bg:#080808;--panel:rgba(14,14,14,.84);--grid:rgba(255,255,255,.018);--radius:8px}
body[data-design="7"]{--a:#38bdf8;--b:#14b8a6;--bg:#03101a;--panel:linear-gradient(145deg,rgba(4,20,30,.84),rgba(3,10,16,.80));--radius:30px}
body[data-design="8"]{--a:#d8b4fe;--b:#f9a8d4;--bg:#0a0910;--panel:rgba(16,14,24,.56);--grid:rgba(216,180,254,.026);--radius:34px}.card{transition:border-radius .25s ease,background .25s ease}
body[data-design="3"] .grid{transform:none;mask-image:linear-gradient(to bottom,#000,transparent 88%);animation:gridMove 7s linear infinite}body[data-design="6"] .orb{display:none}body[data-design="6"] .card:before{display:none}body[data-design="8"] .card{backdrop-filter:blur(36px) saturate(165%)}
@keyframes scan{to{top:88%}}@keyframes shine{0%,58%{transform:translateX(-130%)}78%,100%{transform:translateX(130%)}}@keyframes glitch{0%,88%,100%{transform:translate(3px,1px)}90%{transform:translate(-5px,2px)}92%{transform:translate(7px,-1px)}94%{transform:translate(-2px,0)}}@keyframes logoFloat{50%{transform:translateY(-6px) rotate(2deg)}}@keyframes gridMove{to{background-position:0 42px,42px 0}}@keyframes float1{to{transform:translate(100px,80px)}}@keyframes float2{to{transform:translate(-100px,-70px)}}@media(max-width:600px){.card{padding:38px 22px;border-radius:19px}.actions{flex-direction:column}.btn{justify-content:center}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-design="1">
<div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div>
<main class="card"><div class="scan"></div><img class="logo" src="/caruzo-logo.png" alt="Caruzo"><div class="code">404</div><h1>Diese Seite existiert nicht.</h1><p>Das Profil wurde nicht gefunden oder die Adresse ist nicht mehr verfügbar. Prüfe den Link oder gehe zurück zur Caruzo-Hauptseite.</p><div class="actions"><a class="btn primary" href="/">Zur Hauptseite</a><a class="btn" href="/dashboard">Dashboard öffnen</a></div></main>
<script>
fetch('/api/site-settings',{cache:'no-store'}).then(r=>r.json()).then(j=>{const id=String(j?.page404Design||'1');document.body.dataset.design=/^[1-8]$/.test(id)?id:'1'}).catch(()=>{});
</script>
</body></html>
