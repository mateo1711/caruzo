<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 · Caruzo</title><link rel="icon" href="/caruzo-logo.png" type="image/png"><style>
:root{--a:#00e676;--bg:#050608;--line:rgba(255,255,255,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050608;color:#f4f4f6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 520px at 20% 10%,rgba(0,230,118,.10),transparent 62%),radial-gradient(760px 500px at 85% 85%,rgba(122,92,255,.10),transparent 60%),#050608}.grid{position:fixed;inset:-30%;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;transform:perspective(700px) rotateX(64deg) translateY(22%);mask-image:linear-gradient(to bottom,transparent 8%,#000 45%,transparent 90%);animation:gridMove 12s linear infinite}.orb{position:fixed;width:460px;height:460px;border-radius:50%;filter:blur(80px);opacity:.16;pointer-events:none}.o1{background:#00e676;left:-150px;top:-170px;animation:float1 10s ease-in-out infinite alternate}.o2{background:#7c3aed;right:-150px;bottom:-170px;animation:float2 12s ease-in-out infinite alternate}.card{position:relative;width:min(680px,calc(100vw - 34px));padding:48px 42px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(18,20,22,.82),rgba(5,6,8,.70));box-shadow:0 32px 100px rgba(0,0,0,.58),0 0 70px rgba(0,230,118,.07);backdrop-filter:blur(26px) saturate(145%);text-align:center;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 38%,rgba(255,255,255,.045) 48%,transparent 58%);transform:translateX(-130%);animation:shine 4.8s ease-in-out infinite}.logo{width:58px;height:58px;border-radius:17px;object-fit:cover;box-shadow:0 0 28px rgba(0,230,118,.20);animation:logoFloat 3.6s ease-in-out infinite}.code{position:relative;margin:24px 0 4px;font-size:clamp(72px,16vw,132px);font-weight:900;letter-spacing:-.085em;line-height:.85;background:linear-gradient(180deg,#fff,#777);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 42px rgba(255,255,255,.06)}.code:after{content:"404";position:absolute;inset:0;color:var(--a);opacity:.13;transform:translate(3px,1px);clip-path:polygon(0 42%,100% 38%,100% 52%,0 56%);animation:glitch 2.4s steps(1) infinite}h1{font-size:24px;margin:12px 0 8px;letter-spacing:-.035em}p{margin:0 auto;color:#8e929a;max-width:480px;line-height:1.65;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{height:44px;padding:0 17px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:#dfe2e7;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:13px;transition:.2s}.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.18)}.btn.primary{background:var(--a);border-color:transparent;color:#03120a;box-shadow:0 0 34px rgba(0,230,118,.16)}.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,230,118,.55),transparent);top:12%;animation:scan 4s linear infinite;opacity:.5}@keyframes scan{to{top:88%}}@keyframes shine{0%,58%{transform:translateX(-130%)}78%,100%{transform:translateX(130%)}}@keyframes glitch{0%,88%,100%{transform:translate(3px,1px)}90%{transform:translate(-5px,2px)}92%{transform:translate(7px,-1px)}94%{transform:translate(-2px,0)}}@keyframes logoFloat{50%{transform:translateY(-6px) rotate(2deg)}}@keyframes gridMove{to{background-position:0 42px,42px 0}}@keyframes float1{to{transform:translate(100px,80px)}}@keyframes float2{to{transform:translate(-100px,-70px)}}@media(max-width:600px){.card{padding:38px 22px;border-radius:19px}.actions{flex-direction:column}.btn{justify-content:center}}
</style></head><body><div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div><main class="card"><div class="scan"></div><img class="logo" src="/caruzo-logo.png" alt="Caruzo"><div class="code">404</div><h1>Diese Seite existiert nicht.</h1><p>Das Profil wurde nicht gefunden oder die Adresse ist nicht mehr verfügbar. Prüfe den Link oder gehe zurück zur Caruzo-Hauptseite.</p><div class="actions"><a class="btn primary" href="/">Zur Hauptseite</a><a class="btn" href="/dashboard">Dashboard öffnen</a></div></main></body></html>
