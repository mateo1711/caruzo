<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caruzo · Privat</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#381126 0,transparent 35%),#0e0a0c;color:#f6eff2;font:14px system-ui,sans-serif}.box{width:min(390px,calc(100vw - 32px));padding:28px;border:1px solid #ffffff18;border-radius:22px;background:#181014cc;backdrop-filter:blur(18px);box-shadow:0 25px 80px #0008}h1{margin:0 0 8px;font-size:26px}p{color:#ad9da5;margin:0 0 20px}input,button{width:100%;height:48px;border-radius:12px;border:1px solid #ffffff18;font:inherit}input{padding:0 14px;background:#0f0b0d;color:#fff;outline:none}input:focus{border-color:#ff2e93}button{margin-top:10px;background:#ff2e93;color:#fff;font-weight:800;cursor:pointer}.err{min-height:20px;margin-top:10px;color:#ff8abf;font-size:13px}</style></head><body><form class="box" id="f"><h1>Privater Zugang</h1><p>Diese Hauptseite ist passwortgeschützt.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" autofocus required><button>Entsperren</button><div class="err" id="err"></div></form><script>f.onsubmit=async e=>{e.preventDefault();err.textContent='';const r=await fetch('/api/private-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(r.ok)location.href='/';else err.textContent='Falsches Passwort';}</script></body></html>
