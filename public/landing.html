<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dein Profil, deine Seite</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 40% at 30% 10%,rgba(255,46,147,.28),transparent 70%),radial-gradient(50% 40% at 85% 20%,rgba(255,46,147,.2),transparent 70%),#0e0a0c;color:#f6eff2;font:14px 'JetBrains Mono',monospace}
main{width:min(460px,calc(100vw - 32px));padding:40px 34px;border:1px solid rgba(255,255,255,.09);border-radius:26px;background:rgba(24,16,19,.74);backdrop-filter:blur(18px)}
h1{margin:0 0 10px;font:700 40px/1 'Space Grotesk',sans-serif;letter-spacing:-.03em}
p{color:#a99aa2;line-height:1.6;margin:0 0 26px}
a{display:flex;justify-content:center;gap:10px;padding:14px;border-radius:12px;background:#ff2e93;color:#fff;text-decoration:none;font-weight:700;box-shadow:0 8px 26px -8px rgba(255,46,147,.7)}
a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>猫 Bio-Seite</h1>
  <p>Melde dich mit Discord an. Avatar, Banner, Badges und Server-Tag werden automatisch übernommen.</p>
  <a href="/auth/discord">Mit Discord einloggen</a>
</main>
</body>
</html>
