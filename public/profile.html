<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a0c; --card:rgba(24,16,19,.74); --card-2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.09); --pink:#ff2e93; --plum:#6e2a4b; --plum-dark:#5a2340;
  --text:#f6eff2; --mute:#a99aa2; --dim:.55; --blur:6px;
  --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Hintergrund */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(60% 40% at 30% 10%,rgba(255,46,147,.28),transparent 70%),radial-gradient(50% 40% at 80% 15%,rgba(255,46,147,.22),transparent 70%),#0e0a0c}
.bg img,.bg video{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;filter:blur(var(--blur))}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,6,8,calc(var(--dim)*.7)),rgba(10,6,8,var(--dim)) 60%,rgba(10,6,8,.92))}

/* Enter */
#enter{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(10,6,8,.55);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);cursor:pointer;transition:opacity .7s,visibility .7s}
#enter.gone{opacity:0;visibility:hidden}
#enter span{font-size:15px;letter-spacing:.06em;color:#e9dde3}
#enter span::after{content:"";display:inline-block;width:8px;height:1.1em;margin-left:6px;vertical-align:-2px;background:var(--pink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Nav */
nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:28px;
  padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(20,13,16,.8);backdrop-filter:blur(14px);max-width:calc(100vw - 20px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.logo b{color:var(--pink);font-size:20px;font-weight:700}
.logo i{color:var(--pink);font-style:normal}
nav .links{display:flex;gap:4px}
nav .links a{padding:6px 12px;border-radius:8px;color:var(--mute);border-bottom:2px solid transparent}
nav .links a.on{color:var(--pink);background:rgba(255,46,147,.1);border-bottom-color:var(--pink)}

main{width:min(1000px,calc(100vw - 24px));margin:0 auto;padding:96px 0 120px;display:grid;gap:22px}
section{scroll-margin-top:90px}
.float-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.float-word{position:absolute;opacity:.38;font-weight:700;animation:drift 12s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(60px,-35px) rotate(8deg)}}
.fx-float{animation:cardFloat 4s ease-in-out infinite}@keyframes cardFloat{50%{transform:translateY(-10px)}}.fx-zoom{animation:cardZoom 6s ease-in-out infinite}@keyframes cardZoom{50%{transform:scale(1.015)}}.fx-pulse{animation:cardPulse 3s ease-in-out infinite}@keyframes cardPulse{50%{box-shadow:0 0 45px rgba(255,46,147,.18)}}
.views{justify-self:center;color:var(--mute);padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(15,10,12,.7)}
.card{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px}

/* Profil */
.profile{position:relative;overflow:hidden;padding:0}
.banner{height:120px;background:#2a1a22 center/cover}
.profile .inner{display:flex;gap:26px;padding:34px 34px 30px;align-items:flex-start}
.profile.has-banner .inner{padding-top:0;margin-top:-52px}
.avatar{position:relative;flex:none;width:132px;height:132px}
.avatar .pfp{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--ring,#f5a623);background:#1c1216}
.avatar .deco{position:absolute;left:50%;top:50%;width:120%;height:120%;transform:translate(-50%,-50%);pointer-events:none}
.dot{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#141015;border:0;display:grid;place-items:center}
.dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--st,#747f8d)}
.info{flex:1;min-width:0}
h1{margin:0 0 8px;font:700 46px/1 var(--display);letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card-2);color:#d8c9d0;font-size:12px}
.chip svg{width:12px;height:12px;fill:var(--pink)}
.chip img{width:15px;height:15px;border-radius:3px}
.badges{display:flex;gap:6px;margin:0 0 12px}
.badges span{width:24px;height:24px;display:grid;place-items:center;font-size:15px}
.badges img{width:22px;height:22px}
.tagline{min-height:1.4em;color:#cdbcc4;font-style:italic;border-left:1px solid var(--pink);padding-left:10px;margin-bottom:16px;overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:500}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 8px 26px -8px rgba(255,46,147,.7)}
.btn svg{width:14px;height:14px;fill:currentColor}
.cta{position:absolute;right:38px;top:96px;z-index:2;display:flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;background:var(--pink);color:#2a0716;font-weight:700;
  border:2px solid #fff;outline:3px solid var(--pink);border-radius:2px;box-shadow:5px 5px 0 #fff3}
.cta i{display:grid;place-items:center;width:34px;height:34px;background:#141015;color:#fff;font-style:normal}
.profile.has-banner .cta{top:136px}

/* Spotify */
.spotify{overflow:hidden;padding:0;background:var(--plum);border-color:rgba(255,255,255,.06)}
.spotify iframe{display:block;width:100%;height:352px;border:0;border-radius:0}

/* Socials */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.link{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;text-align:left;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);width:100%;transition:transform .15s,border-color .15s}
.link:hover{border-color:rgba(255,46,147,.5);transform:translateY(-2px)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint,rgba(255,255,255,.07))}
.ico img{width:22px;height:22px}
.link .t{min-width:0;flex:1}
.link b{display:block;font:700 14px var(--display)}
.link small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .ext{width:14px;height:14px;fill:#6ea8ff;flex:none}

/* About */
.about{padding:30px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;color:#e7dce1}

/* Status */
.status{justify-self:center;display:none;align-items:center;gap:10px;padding:9px 18px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(15,10,12,.8);font-weight:700;letter-spacing:.14em;font-size:11px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st)}

/* Musik */
.player{position:fixed;left:14px;bottom:14px;z-index:30;display:none;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(20,13,16,.85);backdrop-filter:blur(14px)}
.player button{width:32px;height:32px;border-radius:50%;border:0;background:var(--pink);display:grid;place-items:center}
.player button svg{width:14px;height:14px;fill:#fff}
.player input{width:90px;accent-color:var(--pink)}
.player span{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#1d1317;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr 1fr}
  .profile .inner{flex-direction:column;align-items:center;text-align:center;padding:26px 18px}
  .chips,.btns,.badges{justify-content:center}
  .tagline{border:0;padding:0}
  .cta{position:static;margin:20px auto 0;width:fit-content}
  nav{gap:10px}
  nav .logo span{display:none}
  h1{font-size:38px}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}.player input{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

.name-gradient{background:linear-gradient(90deg,#ff2e93,#8f7cff,#55e6ff,#ff2e93);background-size:300% 100%;-webkit-background-clip:text;color:transparent!important;animation:nameFlow 5s linear infinite}@keyframes nameFlow{to{background-position:300% 0}}
.name-neon{text-shadow:0 0 8px currentColor,0 0 18px currentColor,0 0 34px #ff2e93}.name-toon{text-shadow:3px 3px 0 #080507,-2px -2px 0 #ff2e93}.name-rubber{animation:nameRub .9s ease-in-out infinite alternate}@keyframes nameRub{to{transform:scaleX(1.07) scaleY(.93)}}
.cursor-particle{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);animation:particleOut .8s ease-out forwards}@keyframes particleOut{to{opacity:0;transform:translate(-50%,-50%) translateY(-20px) scale(.3)}}

/* Caruzo Motion Engine v3 */
.bg.fx-aurora:after,.bg.fx-plasma:after,.bg.fx-dither:after{content:"";position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:.42}
.bg.fx-aurora:after{background:conic-gradient(from 90deg at 50% 50%,transparent,#26e6ff55,#7b4dff66,#ff37bd55,transparent);filter:blur(70px);animation:caruzoSpin 16s linear infinite}
.bg.fx-plasma:after{background:radial-gradient(circle at 25% 30%,#26e6ff77,transparent 28%),radial-gradient(circle at 75% 65%,#b52cff77,transparent 30%);filter:blur(55px);animation:plasmaMove 9s ease-in-out infinite alternate}
.bg.fx-dither:after{inset:0;opacity:.13;background-image:radial-gradient(#fff 0.7px,transparent .8px);background-size:5px 5px;animation:ditherMove 1.8s steps(3) infinite}
@keyframes caruzoSpin{to{transform:rotate(360deg) scale(1.12)}}@keyframes plasmaMove{to{transform:translate3d(6%,-4%,0) scale(1.12)}}@keyframes ditherMove{50%{background-position:3px 2px}}
.cursor-trail-dot{position:fixed;z-index:998;pointer-events:none;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor;transform:translate(-50%,-50%);animation:trailFade .65s ease-out forwards}@keyframes trailFade{to{opacity:0;transform:translate(-50%,-50%) scale(.15)}}
.brandmark{position:fixed;top:18px;left:20px;z-index:40;width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 8px 22px #0008);opacity:.94}
@media(max-width:650px){.brandmark{width:38px;height:38px;top:12px;left:12px}}


/* Caruzo Appearance Engine v5 */
:root{--accent:#8b5cf6;--frame:#8b5cf6;--frame-width:2px;--card-alpha:.72;--card-blur:22px;--card-radius:26px;--border-alpha:.12}
.card{background:rgba(10,10,14,var(--card-alpha));backdrop-filter:blur(var(--card-blur)) saturate(120%);-webkit-backdrop-filter:blur(var(--card-blur)) saturate(120%);border-radius:var(--card-radius);border-color:rgba(255,255,255,var(--border-alpha))}
.card-style-solid .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(10,10,14,max(var(--card-alpha),.86))}
.card-style-outline .card{background:rgba(8,8,12,.18);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.card-style-frosted .card{background:rgba(238,238,245,.065);backdrop-filter:blur(calc(var(--card-blur) * 1.35)) saturate(145%);-webkit-backdrop-filter:blur(calc(var(--card-blur) * 1.35)) saturate(145%)}
.card-style-minimal .card{background:rgba(7,7,9,.5);box-shadow:none}
.avatar:before,.avatar:after{content:"";position:absolute;inset:calc(-5px - var(--frame-width));border-radius:50%;pointer-events:none;z-index:0}.avatar:before{border:var(--frame-width) solid var(--frame);opacity:.72}.avatar .pfp{position:relative;z-index:1;border-width:var(--frame-width);border-color:var(--frame)}.avatar .deco,.avatar .dot{z-index:3}
.avatar-shape-squircle .pfp,.avatar-shape-squircle:before,.avatar-shape-squircle:after{border-radius:24%}.avatar-shape-rounded .pfp,.avatar-shape-rounded:before,.avatar-shape-rounded:after{border-radius:22px}.avatar-shape-square .pfp,.avatar-shape-square:before,.avatar-shape-square:after{border-radius:7px}
.avatar-frame-none:before,.avatar-frame-none:after{display:none}.avatar-frame-glow:before{box-shadow:0 0 14px var(--frame),0 0 30px color-mix(in srgb,var(--frame) 48%,transparent),inset 0 0 12px color-mix(in srgb,var(--frame) 45%,transparent)}.avatar-frame-pulse:before{animation:avatarPulse 1.65s ease-in-out infinite}.avatar-frame-spin:before{border-style:dashed;animation:avatarSpin 4.4s linear infinite}.avatar-frame-rainbow:before{border-style:dashed;border-color:#ff4fa3 #8b5cf6 #22d3ee #39e58c;animation:avatarSpin 3.4s linear infinite;filter:drop-shadow(0 0 8px var(--frame))}.avatar-frame-electric:before{box-shadow:0 0 5px var(--frame),0 0 14px var(--frame),0 0 26px var(--frame);animation:avatarElectric .75s steps(2) infinite}.avatar-frame-scan:after{background:conic-gradient(from 0deg,transparent 0 80%,var(--frame) 84%,transparent 88%);animation:avatarSpin 1.8s linear infinite;filter:blur(1px)}.avatar-frame-hologram:before{border-color:#6ee7ff;box-shadow:8px 0 12px #ff4fa3,-8px 0 12px #38dcff;animation:avatarHolo 1.8s ease-in-out infinite}.avatar-frame-orbit:after{content:"✦";display:grid;place-items:start center;color:var(--frame);font-size:16px;animation:avatarSpin 2.8s linear infinite;filter:drop-shadow(0 0 8px var(--frame));z-index:4}
@keyframes avatarSpin{to{transform:rotate(360deg)}}@keyframes avatarPulse{50%{transform:scale(1.09);opacity:.25;box-shadow:0 0 28px var(--frame)}}@keyframes avatarElectric{50%{transform:scale(1.04);filter:drop-shadow(2px -1px 5px var(--frame))}}@keyframes avatarHolo{50%{transform:scale(1.04);filter:hue-rotate(120deg)}}
.badge-style-pill .badges{gap:7px}.badge-style-pill .badges span{width:auto;height:28px;padding:3px 8px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(255,255,255,.035)}.badge-style-glass .badges span{width:30px;height:30px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.055);backdrop-filter:blur(10px)}
.link{background:linear-gradient(145deg,rgba(18,18,23,var(--card-alpha)),rgba(8,8,11,var(--card-alpha)));border-color:rgba(255,255,255,var(--border-alpha));box-shadow:inset 0 1px rgba(255,255,255,.025),0 12px 35px rgba(0,0,0,.16)}.link .ico{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}.link b{font-size:13px}.link small{color:#85858f}
.viewEye,.viewCount{display:inline-block}.viewEye{margin-right:5px}
.content-center .profile .inner{justify-content:center;text-align:center}.content-center .profile .info{display:flex;flex-direction:column;align-items:center}.content-center .chips,.content-center .badges,.content-center .btns{justify-content:center}.content-center .tagline{border-left:0;border-bottom:1px solid var(--accent);padding-left:0;padding-bottom:8px}
.social-list .grid{grid-template-columns:1fr}.social-compact .grid{grid-template-columns:repeat(4,1fr)}.social-compact .link{padding:11px}.social-compact .ico{width:36px;height:36px}.social-effect-none .link{transition:none}.social-effect-glow .link:hover{transform:none;border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--accent) 24%,transparent)}.social-effect-shine .link{position:relative;overflow:hidden}.social-effect-shine .link:after{content:"";position:absolute;inset:-60% -20%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);transform:translateX(-120%) rotate(10deg);transition:.5s}.social-effect-shine .link:hover:after{transform:translateX(120%) rotate(10deg)}
.profile .views{position:absolute;z-index:8;justify-self:auto;padding:5px 8px;font-size:10px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.views.corner-top-left{top:12px;left:12px;right:auto;bottom:auto}.views.corner-top-right{top:12px;right:12px;left:auto;bottom:auto}.views.corner-bottom-left{bottom:12px;left:12px;right:auto;top:auto}.views.corner-bottom-right{bottom:12px;right:12px;left:auto;top:auto}.views.view-glow{box-shadow:0 0 18px color-mix(in srgb,var(--accent) 28%,transparent)}.views.view-pulse{animation:viewPulse 1.8s ease-in-out infinite}.views.view-scan{overflow:hidden}.views.view-scan:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:translateX(-120%);animation:viewScan 2.5s linear infinite}.views.view-blur{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}@keyframes viewPulse{50%{transform:scale(1.06);opacity:.74}}@keyframes viewScan{to{transform:translateX(120%)}}
.page-fx{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:var(--fx-opacity,.18);color:var(--fx-color,#8b5cf6)}.page-fx-grid{background-image:linear-gradient(color-mix(in srgb,var(--fx-color) 24%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--fx-color) 24%,transparent) 1px,transparent 1px);background-size:var(--fx-density,44px) var(--fx-density,44px);animation:fxDrift var(--fx-speed,9s) linear infinite}.page-fx-scanlines{background:repeating-linear-gradient(180deg,transparent 0 3px,color-mix(in srgb,var(--fx-color) 22%,transparent) 4px);animation:fxScan var(--fx-speed,9s) linear infinite}.page-fx-rays{background:conic-gradient(from 45deg at 50% -20%,transparent 0 8%,color-mix(in srgb,var(--fx-color) 24%,transparent) 10%,transparent 13% 22%,color-mix(in srgb,var(--fx-secondary) 18%,transparent) 25%,transparent 29% 100%);filter:blur(18px);animation:avatarSpin calc(var(--fx-speed,9s) * 2) linear infinite}.page-fx-stars{background-image:radial-gradient(var(--fx-color) .7px,transparent .9px),radial-gradient(var(--fx-secondary) .6px,transparent .8px);background-size:37px 37px,61px 61px;background-position:0 0,17px 23px;animation:fxDrift calc(var(--fx-speed,9s) * 2) linear infinite}.page-fx-mesh{background:radial-gradient(circle at 20% 25%,color-mix(in srgb,var(--fx-color) 30%,transparent),transparent 28%),radial-gradient(circle at 75% 70%,color-mix(in srgb,var(--fx-secondary) 28%,transparent),transparent 30%);filter:blur(40px);animation:plasmaMove var(--fx-speed,9s) ease-in-out infinite alternate}.page-fx-matrix{background-image:linear-gradient(180deg,color-mix(in srgb,var(--fx-color) 20%,transparent),transparent 20%);background-size:9px 66px;mask-image:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 8px);animation:fxScan calc(var(--fx-speed,9s) * .7) linear infinite}@keyframes fxDrift{to{background-position:var(--fx-density,44px) var(--fx-density,44px)}}@keyframes fxScan{to{background-position:0 80px}}
@media(max-width:720px){.social-compact .grid{grid-template-columns:1fr 1fr}.profile .views{font-size:9px}}

</style>
<link rel="icon" type="image/png" href="/caruzo-logo.png"></head>
<body>
<div class="bg" id="bg"></div><div class="float-layer" id="floatLayer"></div>
<div id="enter" role="button" tabindex="0"><span id="enterText">click to enter...</span></div>

<nav>
  <div class="logo"><b>猫</b><span id="logoName"></span></div>
</nav>

<main>
  <section id="home" style="display:grid;gap:22px">
    <div class="card profile" id="profile"></div>
    <div class="card spotify" id="spotify" hidden></div>
  </section>
  <section id="socials"><div class="grid" id="grid"></div></section>
  <section id="about" hidden><div class="card about" id="aboutText"></div></section>
  <div class="status" id="status"></div>
  <div class="views" id="views"></div>
</main>

<div class="player" id="player">
  <button id="pp" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><path id="ppIcon" d="M8 5v14l11-7z"/></svg></button>
  <span id="trackName"></span>
  <input type="range" id="vol" min="0" max="100" aria-label="Lautstärke">
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v != null && v !== false) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => e.append(c?.nodeType ? c : document.createTextNode(c ?? '')));
  return e;
};
const svg = (d, cls) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); if (cls) s.setAttribute('class', cls); const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.append(p); return s; };
const PATH = {

const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const STATUS = { online: ['#3ba55d', 'ONLINE'], idle: ['#f0b232', 'IDLE'], dnd: ['#ed4245', 'DND'], offline: ['#747f8d', 'OFFLINE'] };

const path = location.pathname.length > 1 ? decodeURIComponent(location.pathname.slice(1).split('/')[0]) : '__home__';
let audio;

fetch('/api/profile/' + encodeURIComponent(path)).then(r => r.ok ? r.json() : Promise.reject()).then(render).catch(() => {
  document.body.replaceChildren(el('p', { style: 'padding:60px;text-align:center' }, 'Profil nicht gefunden.'));
});

function render(u) {
  const d = u.discord, s = u.settings, des = u.design || {}, vs = u.viewsStyle || {}, pf = u.pageFx || {};
  const hexToRgb = h => { const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||''); return m ? `${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}` : '139,92,246'; };
  const accent = des.accentColor || '#8b5cf6';
  document.documentElement.style.setProperty('--pink', accent); document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--frame', des.avatarFrameColor || accent); document.documentElement.style.setProperty('--frame-width', (des.avatarFrameWidth ?? 2) + 'px');
  document.documentElement.style.setProperty('--card-alpha', (des.cardOpacity ?? 72) / 100); document.documentElement.style.setProperty('--card-blur', (des.cardBlur ?? 22) + 'px'); document.documentElement.style.setProperty('--card-radius', (des.cardRadius ?? 26) + 'px'); document.documentElement.style.setProperty('--border-alpha', (des.borderOpacity ?? 12) / 100);
  document.body.classList.add('card-style-' + (des.cardStyle || 'glass'), 'social-' + (des.socialLayout || 'grid'), 'social-effect-' + (des.socialEffect || 'lift'), 'badge-style-' + (des.badgeStyle || 'icon'));
  if (des.contentAlign === 'center') document.body.classList.add('content-center');
  document.title = u.displayName; setupBrowserTab(u);
  $('#logoName').append(u.username, el('i', {}, '.lol'));
  $('#enterText').textContent = u.enterText;

  // Hintergrund
  document.documentElement.style.setProperty('--blur', u.background.blur + 'px');
  document.documentElement.style.setProperty('--dim', u.background.dim / 100);
  if (pf.type && pf.type !== 'none') {
    const layer = el('div', { class: 'page-fx page-fx-' + pf.type });
    layer.style.setProperty('--fx-color', pf.color || accent); layer.style.setProperty('--fx-secondary', pf.secondary || '#ff2e93');
    layer.style.setProperty('--fx-opacity', (pf.opacity ?? 18) / 100); layer.style.setProperty('--fx-density', (pf.density ?? 44) + 'px'); layer.style.setProperty('--fx-speed', (pf.speed ?? 9) + 's');
    $('#bg').append(layer);
  }
  if (u.background.url) {
    const bg = u.background.type === 'video'
      ? el('video', { src: u.background.url, loop: '', playsinline: '' })
      : el('img', { src: u.background.url, alt: '' });
    if (bg.tagName === 'VIDEO') bg.muted = true;
    $('#bg').prepend(bg);
  }
  const fx = u.background.effect || 'none';
  if (fx !== 'none') $('#profile').classList.add('fx-' + fx);
  (u.floating || []).forEach((txt,i)=>{ const w=el('span',{class:'float-word'},txt); w.style.left=(8+(i*17)%82)+'%'; w.style.top=(10+(i*23)%75)+'%'; w.style.animationDelay=-(i*1.7)+'s'; $('#floatLayer').append(w); });

  // Profil-Karte
  const p = $('#profile');
  const showBanner = s.showBanner && (d.banner || d.bannerColor);
  if (showBanner) { p.classList.add('has-banner'); p.append(el('div', { class: 'banner', style: d.banner ? `background-image:url("${d.banner}")` : `background:${d.bannerColor}` })); }

  const avatar = el('div', { class: `avatar avatar-frame-${des.avatarFrameEffect || 'glow'} avatar-shape-${des.avatarShape || 'circle'}` }, el('img', { class: 'pfp', src: d.avatar, alt: '' }));
  if (s.showDecoration && d.decoration) avatar.append(el('img', { class: 'deco', src: d.decoration, alt: '' }));
  if (s.showStatus) avatar.append(el('span', { class: 'dot', id: 'dot' }));

  const chips = el('div', { class: 'chips' });
  const addChip = (icon, text) => text && chips.append(el('span', { class: 'chip' }, svg(PATH[icon]), text));
  addChip('tag', u.tags.label); addChip('pin', u.tags.location); addChip('cake', u.tags.age);
  if (s.showTag && d.serverTag) chips.append(el('span', { class: 'chip', title: 'Server-Tag' }, d.serverTag.badge ? el('img', { src: d.serverTag.badge, alt: '' }) : '', d.serverTag.tag));

  const name=el('h1',{},u.displayName); applyNameEffect(name,u); const info = el('div', { class: 'info' }, name, chips);
  if (s.showBadges && d.badges.length) {
    info.append(el('div', { class: 'badges' }, d.badges.map(b => {
      const fb = el('span', { title: b.name }, b.emoji);
      if (!b.icon) return fb;
      const img = el('img', { src: `https://cdn.discordapp.com/badge-icons/${b.icon}.png`, alt: b.name });
      const w = el('span', { title: b.name }, img);
      img.onerror = () => w.replaceChildren(b.emoji);
      return w;
    })));
  }
  const tl = el('div', { class: 'tagline', id: 'tagline' });
  info.append(tl, el('div', { class: 'btns' },
    el('a', { class: 'btn pri', href: '#socials' }, svg(PATH.link), 'Socials'),
    u.about ? el('a', { class: 'btn', href: '#about' }, svg(PATH.user), 'About Me') : ''));
  p.append(el('div', { class: 'inner' }, avatar, info));
  if (fx === 'tilt' && !matchMedia('(prefers-reduced-motion:reduce)').matches) { p.onmousemove=e=>{const r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;p.style.transform=`perspective(900px) rotateX(${-y*5}deg) rotateY(${x*7}deg)`}; p.onmouseleave=()=>p.style.transform=''; }
  typewriter(tl, u.tagline);

  // Spotify
  const m = String(u.spotify || '').match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track)\/([A-Za-z0-9]+)/);
  if (m) { const sp = $('#spotify'); sp.hidden = false; sp.append(el('iframe', { src: `https://open.spotify.com/embed/${m[1]}/${m[2]}?theme=0`, loading: 'lazy', allow: 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture', title: 'Spotify' })); }

  // Socials
  const grid = $('#grid');
  const icon = (slugName, color, tint) => el('div', { class: 'ico', style: tint ? `--tint:${tint}` : '' }, el('img', { src: `https://cdn.simpleicons.org/${slugName}/${color}`, alt: '' }));
  const card = (ico, title, sub, href, onclick) => {
    const inner = [ico, el('div', { class: 't' }, el('b', {}, title), el('small', {}, sub)), href ? svg(PATH.ext, 'ext') : ''];
    return href ? el('a', { class: 'link', href, target: '_blank', rel: 'noopener noreferrer' }, inner)
                : el('button', { class: 'link', onclick }, inner);
  };
  grid.append(card(icon('discord', '5865F2', 'rgba(88,101,242,.16)'), 'Discord', d.username, null, () => { navigator.clipboard?.writeText(d.username); toast('Discord-Name kopiert'); }));
  u.links.steam.forEach((x, i) => grid.append(card(icon('steam', '66c0f4', 'rgba(102,192,244,.14)'), 'Steam', x.name || host(x.url), x.url)));
  if (u.links.twitch) grid.append(card(icon('twitch', '9146FF', 'rgba(145,70,255,.16)'), 'Twitch', u.links.twitch.split('/').filter(Boolean).pop(), u.links.twitch));
  if (u.links.tiktok) grid.append(card(icon('tiktok', 'ffffff', 'rgba(255,255,255,.08)'), 'TikTok', u.links.tiktok.split('/').filter(Boolean).pop(), u.links.tiktok));
  const socialDefs=[['x','x','ffffff','X'],['epic','epicgames','ffffff','Epic Games'],['instagram','instagram','E4405F','Instagram'],['youtube','youtube','FF0000','YouTube'],['github','github','ffffff','GitHub'],['bluesky','bluesky','0285FF','Bluesky']];
  socialDefs.forEach(([k,ic,c,n])=>{const v=u.links[k];if(v)grid.append(card(icon(ic,c,'rgba(255,255,255,.08)'),n,v.split('/').filter(Boolean).pop(),v))});
  u.links.custom.forEach(x => grid.append(card(el('div', { class: 'ico' }, svg(PATH.link, '')), x.label || host(x.url), host(x.url), x.url)));
  grid.querySelectorAll('.ico svg').forEach(s => { s.style.cssText = 'width:20px;height:20px;fill:#e9dde3'; });

  const views = $('#views');
  if (vs.visible === false) views.hidden = true; else {
    views.hidden = false; views.replaceChildren(el('span',{class:'viewEye'},'◉'),el('span',{class:'viewCount'},Number(u.views || 0).toLocaleString('de-CH')));
    views.className = `views corner-${vs.corner || 'top-right'} view-${vs.effect || 'glow'}`;
    views.style.background = `rgba(15,10,12,${(vs.backgroundOpacity ?? 22)/100})`; views.style.borderColor = `rgba(255,255,255,${(vs.borderOpacity ?? 14)/100})`;
    views.querySelector('.viewEye').style.opacity=(vs.eyeOpacity ?? 92)/100; views.querySelector('.viewCount').style.opacity=(vs.countOpacity ?? 88)/100; p.append(views);
  }

  // About
  if (u.about) { $('#about').hidden = false; $('#aboutText').textContent = u.about; }

  // Musik / Video-Ton: Musik hat in 'auto' immer Vorrang.
  const video = document.querySelector('#bg video');
  const mode = u.soundMode || 'auto';
  const useMusic = !!u.music.url && (mode === 'auto' || mode === 'music');
  const useVideoSound = !!video && u.background.videoSound !== false && (mode === 'video' || (mode === 'auto' && !u.music.url));
  if (useMusic) setupMusic(u.music);
  if (video) { video.muted = !useVideoSound; video.volume = 0.30; }

  // Status via Lanyard
  if (s.showStatus) { pollStatus(d.id); setInterval(() => pollStatus(d.id), 30000); }

  setupCursor(u.cursor || {});

  // Enter
  const enter = $('#enter');
  const go = () => { enter.classList.add('gone'); audio?.play().catch(() => {}); document.querySelector('#bg video')?.play().catch(() => {}); };
  enter.onclick = go; enter.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && go();


}


function applyNameEffect(node,u){
  const d=u.design||{}; node.style.color=d.nameColor||'#f6eff2';
  if(d.nameEffect==='gradient')node.classList.add('name-gradient');
  if(d.nameEffect==='neon')node.classList.add('name-neon');
  if(d.nameEffect==='toon')node.classList.add('name-toon');
  if(d.nameEffect==='rubber')node.classList.add('name-rubber');
  if(d.nameEffect==='typewriter')typewriter(node,u.displayName);
}
function setupBrowserTab(u){
  const b=u.browser||{}, msgs=(b.messages||[]).filter(Boolean); if(!msgs.length)return;
  let i=0,pos=0,dir=1; const speed=Number(b.speed)||1500;
  if(b.effect==='rotate') return setInterval(()=>document.title=msgs[i++%msgs.length],speed);
  if(b.effect==='pulse') return setInterval(()=>{const m=msgs[i++%msgs.length];document.title=m+' '+'.'.repeat((i%3)+1)},speed);
  if(b.effect==='marquee'){let text=msgs.join('   ✦   ')+'   ';return setInterval(()=>{text=text.slice(1)+text[0];document.title=text.slice(0,28)},Math.max(120,speed/8));}
  const tick=()=>{const m=msgs[i%msgs.length];document.title=m.slice(0,pos);pos+=dir;if(pos>m.length){dir=-1;setTimeout(tick,speed)}else if(pos<0){dir=1;pos=0;i++;setTimeout(tick,350)}else setTimeout(tick,90)};tick();
}
function setupCursor(c){
  const cursors={crosshair:'crosshair',dot:'crosshair',ring:'crosshair',cross:'crosshair',arrow:'default',star:'crosshair'};
  if(c.svg&&c.svg.startsWith('data:image/svg+xml')) document.body.style.cursor=`url("${c.svg}"), auto`; else if(c.image&&c.image!=='system') document.body.style.cursor=cursors[c.image]||'default';
  if(!c.effect||c.effect==='none'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let last=0, hue=190; const glyph={spark:'✦',snow:'❄',hearts:'♥',fire:'✦',magic:'✧',orbit:'◌',matrix:'▪'};
  addEventListener('pointermove',e=>{
    const now=performance.now(); if(now-last<28)return; last=now; hue=(hue+7)%360;
    const p=document.createElement('span');
    if(c.effect==='trail'){p.className='cursor-trail-dot';p.style.color=`hsl(${hue} 90% 65%)`;} else {p.className='cursor-particle';p.textContent=glyph[c.effect]||'✦';p.style.color=`hsl(${hue} 92% 68%)`;p.style.textShadow='0 0 12px currentColor';p.style.fontSize=(c.effect==='matrix'?8:10+Math.random()*8)+'px';}
    p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';document.body.append(p);setTimeout(()=>p.remove(),900);
  },{passive:true});
}
function typewriter(node, text) {
  if (!text) return node.remove();
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return node.textContent = text;
  let i = 0, dir = 1;
  (function tick() {
    node.textContent = text.slice(0, i);
    i += dir;
    let wait = 70;
    if (i > text.length) { dir = -1; wait = 2200; }
    else if (i < 0) { dir = 1; i = 0; wait = 600; }
    setTimeout(tick, wait);
  })();
}

function setupMusic(m) {
  audio = new Audio(m.url); audio.loop = true; const startVolume = Number.isFinite(Number(m.volume)) ? Number(m.volume) : 30; audio.volume = Math.max(0,Math.min(1,startVolume/100));
  $('#player').style.display = 'flex';
  $('#trackName').textContent = m.title || 'Musik';
  $('#vol').value = m.volume;
  $('#vol').oninput = e => audio.volume = e.target.value / 100;
  const icon = $('#ppIcon');
  $('#pp').onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => icon.setAttribute('d', PATH.pause);
  audio.onpause = () => icon.setAttribute('d', PATH.play);
}

async function pollStatus(id) {
  try {
    const r = await (await fetch('https://api.lanyard.rest/v1/users/' + id)).json();
    if (!r.success) return;
    const [color, label] = STATUS[r.data.discord_status] || STATUS.offline;
    document.documentElement.style.setProperty('--st', color);
    const st = $('#status'); st.style.display = 'inline-flex'; st.textContent = label;
    document.querySelector('.avatar')?.style.setProperty('--st', color);
  } catch {}
}
</script>
