<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a0c; --card:rgba(24,16,19,.74); --card-2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.09); --pink:#ff2e93; --plum:#6e2a4b; --plum-dark:#5a2340;
  --text:#f6eff2; --mute:#a99aa2; --dim:.55; --blur:6px;
  --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Hintergrund */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(60% 40% at 30% 10%,rgba(255,46,147,.28),transparent 70%),radial-gradient(50% 40% at 80% 15%,rgba(255,46,147,.22),transparent 70%),#0e0a0c}
.bg img,.bg video,.bg .bg-yt{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;filter:blur(var(--blur))}.bg .bg-yt{border:0;pointer-events:none}.bg.youtube-bg .bg-yt{width:120vw;height:67.5vw;min-height:120vh;min-width:213.333vh;left:50%;top:50%;transform:translate(-50%,-50%)}
.bg::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(10,6,8,calc(var(--dim)*.7)),rgba(10,6,8,var(--dim)) 60%,rgba(10,6,8,.92))}

/* Enter */
#enter{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(10,6,8,.55);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);cursor:pointer;transition:opacity .7s,visibility .7s}
#enter.gone{opacity:0;visibility:hidden}
#enter span{font-size:15px;letter-spacing:.06em;color:#e9dde3}
#enter span::after{content:"";display:inline-block;width:8px;height:1.1em;margin-left:6px;vertical-align:-2px;background:var(--pink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Nav */
nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:28px;
  padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(20,13,16,.8);backdrop-filter:blur(14px);max-width:calc(100vw - 20px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.logo b{color:var(--pink);font-size:20px;font-weight:700}
.logo i{color:var(--pink);font-style:normal}
nav .links{display:flex;gap:4px}
nav .links a{padding:6px 12px;border-radius:8px;color:var(--mute);border-bottom:2px solid transparent}
nav .links a.on{color:var(--pink);background:rgba(255,46,147,.1);border-bottom-color:var(--pink)}

main{width:min(var(--profile-width,1000px),calc(100vw - 24px));margin:0 auto;padding:96px 0 120px;display:grid;gap:22px}
section{scroll-margin-top:90px}
.float-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.float-word{position:absolute;opacity:.38;font-weight:700;animation:drift 12s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(60px,-35px) rotate(8deg)}}
.fx-float{animation:cardFloat 4s ease-in-out infinite}@keyframes cardFloat{50%{transform:translateY(-10px)}}.fx-zoom{animation:cardZoom 6s ease-in-out infinite}@keyframes cardZoom{50%{transform:scale(1.015)}}.fx-pulse{animation:cardPulse 3s ease-in-out infinite}@keyframes cardPulse{50%{box-shadow:0 0 45px rgba(255,46,147,.18)}}.fx-levitate{animation:fxLevitate 5.2s cubic-bezier(.45,0,.2,1) infinite}.fx-breathe{animation:fxBreathe 3.8s ease-in-out infinite}.fx-sway{transform-origin:50% 15%;animation:fxSway 6.5s ease-in-out infinite}.fx-glitch{animation:fxCardGlitch 2.8s steps(2) infinite}.fx-shimmer{position:relative}.fx-shimmer:after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);animation:fxShimmer 4.2s ease-in-out infinite;mix-blend-mode:screen}@keyframes fxLevitate{50%{transform:translateY(-13px) scale(1.006);filter:drop-shadow(0 18px 22px rgba(0,0,0,.18))}}@keyframes fxBreathe{50%{transform:scale(1.012);backdrop-filter:blur(calc(var(--card-blur) + 6px)) saturate(calc(var(--glass-saturation) + 12%))}}@keyframes fxSway{25%{transform:rotate(.45deg) translateY(-3px)}75%{transform:rotate(-.45deg) translateY(2px)}}@keyframes fxCardGlitch{0%,92%,100%{transform:none;filter:none}94%{transform:translate(2px,-1px);filter:hue-rotate(35deg)}96%{transform:translate(-2px,1px);filter:hue-rotate(-30deg)}}@keyframes fxShimmer{45%,100%{transform:translateX(120%)}}
.views{justify-self:center;color:var(--mute);padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(15,10,12,.7)}
.card{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px}

/* Profil */
.profile{position:relative;overflow:hidden;padding:0}
.banner{height:120px;background:#2a1a22 center/cover}
.profile .inner{display:flex;gap:26px;padding:34px 34px 30px;align-items:flex-start}
.profile.has-banner .inner{padding-top:0;margin-top:-52px}
.avatar{position:relative;flex:none;width:var(--avatar-size,132px);height:var(--avatar-size,132px)}
.avatar .pfp{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--ring,#f5a623);background:#1c1216}
.avatar .deco{position:absolute;left:50%;top:50%;width:120%;height:120%;transform:translate(-50%,-50%);pointer-events:none}
.dot{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#141015;border:0;display:grid;place-items:center}
.dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--st,#747f8d)}
.info{flex:1;min-width:0}
h1{margin:0 0 8px;font:700 46px/1 var(--display);letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card-2);color:#d8c9d0;font-size:12px}
.chip svg{width:12px;height:12px;fill:var(--pink)}
.chip img{width:15px;height:15px;border-radius:3px}
.badges{display:flex;gap:6px;margin:0 0 12px}
.badges span{width:24px;height:24px;display:grid;place-items:center;font-size:15px}
.badges img{width:22px;height:22px}
.tagline{min-height:1.4em;color:#cdbcc4;font-style:italic;border-left:1px solid var(--pink);padding-left:10px;margin-bottom:16px;overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:500}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 8px 26px -8px rgba(255,46,147,.7)}
.btn svg{width:14px;height:14px;fill:currentColor}
.cta{position:absolute;right:38px;top:96px;z-index:2;display:flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;background:var(--pink);color:#2a0716;font-weight:700;
  border:2px solid #fff;outline:3px solid var(--pink);border-radius:2px;box-shadow:5px 5px 0 #fff3}
.cta i{display:grid;place-items:center;width:34px;height:34px;background:#141015;color:#fff;font-style:normal}
.profile.has-banner .cta{top:136px}

/* Spotify */
/* Spotify controls the inside of its cross-origin iframe. Keep the iframe native so
   Spotify can render its own artwork-based / dynamic background correctly. The
   Caruzo glass shell is only behind it and never overlays or blends the controls. */
.spotify{--spotify-blur:26px;--spotify-glow:.24;--spotify-height:352px;position:relative;isolation:isolate;overflow:hidden;padding:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--card) 82%,var(--accent) 18%),color-mix(in srgb,var(--card) 94%,#000 6%));border-color:rgba(255,255,255,.14);backdrop-filter:blur(var(--spotify-blur)) saturate(145%);-webkit-backdrop-filter:blur(var(--spotify-blur)) saturate(145%);box-shadow:0 22px 70px rgba(0,0,0,.34),0 0 calc(22px + 36px * var(--spotify-glow)) color-mix(in srgb,var(--accent) 24%,transparent)}
.spotify:before{content:"";position:absolute;inset:-28%;z-index:0;background:radial-gradient(circle at 10% 20%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 30%),radial-gradient(circle at 88% 78%,rgba(255,255,255,.07),transparent 28%);filter:blur(calc(var(--spotify-blur) + 18px));opacity:.46;pointer-events:none}
.spotify iframe{position:relative;z-index:1;display:block;width:100%;height:var(--spotify-height);border:0;border-radius:18px;background:#181818;box-shadow:0 16px 46px rgba(0,0,0,.26);opacity:1;filter:none;mix-blend-mode:normal}
.spotify[data-kind="track"]{--spotify-height:152px}
.spotify[data-kind="playlist"],.spotify[data-kind="album"]{--spotify-height:352px}
.spotify[data-layout="full"]{--spotify-height:420px}
.spotify[data-kind="track"][data-layout="full"]{--spotify-height:352px}
@media(max-width:720px){.spotify{padding:6px}.spotify[data-kind="playlist"],.spotify[data-kind="album"]{--spotify-height:352px}.spotify[data-layout="full"]{--spotify-height:400px}}

.activity-card:empty{display:none!important}
.activity-card{display:flex;align-items:center;gap:14px;padding:15px 18px;min-height:78px;background:linear-gradient(135deg,color-mix(in srgb,var(--card) 88%,var(--accent) 12%),var(--card));border-color:rgba(255,255,255,.11);backdrop-filter:blur(calc(var(--card-blur,22px) + 5px)) saturate(140%);-webkit-backdrop-filter:blur(calc(var(--card-blur,22px) + 5px)) saturate(140%);overflow:hidden;position:relative}
.activity-card:before{content:"";position:absolute;inset:-70% 55% -70% -15%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 62%);filter:blur(20px);pointer-events:none}
.activity-icon{position:relative;z-index:1;width:46px;height:46px;flex:none;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--accent) 35%,rgba(255,255,255,.12));border-radius:15px;background:color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.04));box-shadow:0 0 24px color-mix(in srgb,var(--accent) 16%,transparent)}
.activity-icon svg{width:22px;height:22px;fill:var(--accent)}
.activity-copy{position:relative;z-index:1;min-width:0;flex:1}.activity-copy small{display:block;margin-bottom:3px;color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.activity-copy b{display:block;font:700 15px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity-copy span{display:block;margin-top:3px;color:#cdbfc5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity-live{position:relative;z-index:1;display:flex;align-items:center;gap:6px;color:var(--mute);font-size:10px}.activity-live i{width:7px;height:7px;border-radius:50%;background:var(--st,#747f8d);box-shadow:0 0 0 4px color-mix(in srgb,var(--st,#747f8d) 16%,transparent);animation:activityPulse 1.8s ease-in-out infinite}@keyframes activityPulse{50%{transform:scale(.72);opacity:.6}}

/* Socials */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.link{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--social-radius,18px);text-align:left;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);width:100%;transition:transform .15s,border-color .15s}
.link:hover{border-color:rgba(255,46,147,.5);transform:translateY(-2px)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint,rgba(255,255,255,.07))}
.ico img{width:22px;height:22px}
.link .t{min-width:0;flex:1}
.link b{display:block;font:700 14px var(--display)}
.link small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .ext{width:14px;height:14px;fill:#6ea8ff;flex:none}

/* About */
.about{padding:30px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;color:#e7dce1}

/* Status */
.status{justify-self:center;display:none;align-items:center;gap:10px;padding:9px 18px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(15,10,12,.8);font-weight:700;letter-spacing:.14em;font-size:11px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st)}

/* Musik */
.player{position:fixed;left:14px;bottom:14px;z-index:30;display:none;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(20,13,16,.85);backdrop-filter:blur(14px)}
.player button{width:32px;height:32px;border-radius:50%;border:0;background:var(--pink);display:grid;place-items:center}
.player button svg{width:14px;height:14px;fill:#fff}
.player input{width:90px;accent-color:var(--pink)}
.player span{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#1d1317;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr 1fr}
  .profile .inner{flex-direction:column;align-items:center;text-align:center;padding:26px 18px}
  .chips,.btns,.badges{justify-content:center}
  .tagline{border:0;padding:0}
  .cta{position:static;margin:20px auto 0;width:fit-content}
  nav{gap:10px}
  nav .logo span{display:none}
  h1{font-size:38px}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}.player input{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

.name-gradient{background:linear-gradient(90deg,#ff2e93,#8f7cff,#55e6ff,#ff2e93);background-size:300% 100%;-webkit-background-clip:text;color:transparent!important;animation:nameFlow 5s linear infinite}@keyframes nameFlow{to{background-position:300% 0}}
.name-neon{text-shadow:0 0 8px currentColor,0 0 18px currentColor,0 0 34px #ff2e93}.name-toon{text-shadow:3px 3px 0 #080507,-2px -2px 0 #ff2e93}.name-rubber{animation:nameRub .9s ease-in-out infinite alternate}@keyframes nameRub{to{transform:scaleX(1.07) scaleY(.93)}}.name-chrome{background:linear-gradient(180deg,#fff,#73737d 38%,#fff 49%,#4b4b55 72%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none}.name-shimmer{background:linear-gradient(100deg,#fff 0 34%,var(--accent) 46%,#fff 56% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:nameFlow 2.6s linear infinite}.name-glitch{text-shadow:3px 0 #22d3ee,-3px 0 #ff2e93;animation:nameGlitch 1.05s steps(2) infinite}.name-wave{animation:nameWave 2.2s ease-in-out infinite}@keyframes nameGlitch{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,0)}}@keyframes nameWave{50%{transform:translateY(-3px);letter-spacing:-.01em}}
.cursor-particle{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);animation:particleOut .8s ease-out forwards}@keyframes particleOut{to{opacity:0;transform:translate(-50%,-50%) translateY(-20px) scale(.3)}}

/* Caruzo Motion Engine v3 */
.bg.fx-aurora:before,.bg.fx-plasma:before,.bg.fx-dither:before{content:"";position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.42}
.bg.fx-aurora:before{background:conic-gradient(from 90deg at 50% 50%,transparent,#26e6ff55,#7b4dff66,#ff37bd55,transparent);filter:blur(70px);animation:caruzoSpin 16s linear infinite}
.bg.fx-plasma:before{background:radial-gradient(circle at 25% 30%,#26e6ff77,transparent 28%),radial-gradient(circle at 75% 65%,#b52cff77,transparent 30%);filter:blur(55px);animation:plasmaMove 9s ease-in-out infinite alternate}
.bg.fx-dither:before{inset:0;opacity:.13;background-image:radial-gradient(#fff 0.7px,transparent .8px);background-size:5px 5px;animation:ditherMove 1.8s steps(3) infinite}
@keyframes caruzoSpin{to{transform:rotate(360deg) scale(1.12)}}@keyframes plasmaMove{to{transform:translate3d(6%,-4%,0) scale(1.12)}}@keyframes ditherMove{50%{background-position:3px 2px}}
.cursor-trail-dot{position:fixed;z-index:998;pointer-events:none;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor;transform:translate(-50%,-50%);animation:trailFade .65s ease-out forwards}@keyframes trailFade{to{opacity:0;transform:translate(-50%,-50%) scale(.15)}}
.brandmark{position:fixed;top:18px;left:20px;z-index:40;width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 8px 22px #0008);opacity:.94}
@media(max-width:650px){.brandmark{width:38px;height:38px;top:12px;left:12px}}


/* Caruzo Appearance Engine v5 */
:root{--accent:#8b5cf6;--frame:#8b5cf6;--frame-width:2px;--card-alpha:.72;--card-blur:22px;--card-radius:26px;--border-alpha:.12;--card-glow-size:10px;--glass-saturation:120%;--avatar-size:132px;--social-radius:18px;--profile-width:1000px}
.card{background:rgba(10,10,14,var(--card-alpha));backdrop-filter:blur(var(--card-blur)) saturate(var(--glass-saturation));-webkit-backdrop-filter:blur(var(--card-blur)) saturate(var(--glass-saturation));border-radius:var(--card-radius);border-color:rgba(255,255,255,var(--border-alpha))}.profile{box-shadow:0 28px 85px rgba(0,0,0,.28),0 0 var(--card-glow-size) color-mix(in srgb,var(--accent) 45%,transparent)}
.card-style-solid .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(10,10,14,max(var(--card-alpha),.86))}
.card-style-outline .card{background:rgba(8,8,12,.18);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.card-style-frosted .card{background:rgba(238,238,245,.065);backdrop-filter:blur(calc(var(--card-blur) * 1.35)) saturate(145%);-webkit-backdrop-filter:blur(calc(var(--card-blur) * 1.35)) saturate(145%)}
.card-style-minimal .card{background:rgba(7,7,9,.5);box-shadow:none}
.avatar:before,.avatar:after{content:"";position:absolute;inset:calc(-5px - var(--frame-width));border-radius:50%;pointer-events:none;z-index:0}.avatar:before{border:var(--frame-width) solid var(--frame);opacity:.72}.avatar .pfp{position:relative;z-index:1;border-width:var(--frame-width);border-color:var(--frame)}.avatar .deco,.avatar .dot{z-index:3}
.avatar-shape-squircle .pfp,.avatar-shape-squircle:before,.avatar-shape-squircle:after{border-radius:24%}.avatar-shape-rounded .pfp,.avatar-shape-rounded:before,.avatar-shape-rounded:after{border-radius:22px}.avatar-shape-square .pfp,.avatar-shape-square:before,.avatar-shape-square:after{border-radius:7px}

      items.forEach((it,i)=>{it.phase+=dt*.002*rate; const tx=px+Math.cos(it.phase+i)*it.amp, ty=py+Math.sin(it.phase*1.15+i)*it.amp; ctx.strokeStyle=rgba(i%3?c1:c2,alpha*.26); ctx.beginPath(); ctx.moveTo(it.x,it.y); ctx.lineTo(tx,ty); ctx.stroke(); it.x+=(tx-it.x)*.035; it.y+=(ty-it.y)*.035; ctx.beginPath(); ctx.fillStyle=rgba(c1,alpha*.8); ctx.arc(it.x,it.y,1.2+it.r*.4,0,Math.PI*2); ctx.fill()});

      items.forEach(it=>{it.x+=it.vx*dt*.05*rate;it.y+=it.vy*dt*.05*rate;if(it.x<-10)it.x=w+10;if(it.x>w+10)it.x=-10;if(it.y<-10)it.y=h+10;if(it.y>h+10)it.y=-10;ctx.beginPath();ctx.fillStyle=rgba(c1,alpha*.85);ctx.arc(it.x,it.y,it.r,0,Math.PI*2);ctx.fill()});

  addEventListener('pointermove',e=>{pointer.x=e.clientX/Math.max(1,innerWidth);pointer.y=e.clientY/Math.max(1,innerHeight)},{passive:true});

}

function applyNameEffect(node,u){
  const d=u.design||{}; node.style.color=d.nameColor||'#f6eff2';
  if(d.nameEffect==='gradient')node.classList.add('name-gradient');
  if(d.nameEffect==='neon')node.classList.add('name-neon');
  if(d.nameEffect==='toon')node.classList.add('name-toon');
  if(d.nameEffect==='rubber')node.classList.add('name-rubber');
  if(d.nameEffect==='chrome')node.classList.add('name-chrome');
  if(d.nameEffect==='shimmer')node.classList.add('name-shimmer');
  if(d.nameEffect==='glitch')node.classList.add('name-glitch');
  if(d.nameEffect==='wave')node.classList.add('name-wave');

function setupBrowserTab(u){
  const b=u.browser||{}, msgs=(b.messages||[]).filter(Boolean); if(!msgs.length)return;
  let i=0,pos=0,dir=1; const speed=Number(b.speed)||1500;
  if(b.effect==='rotate') return setInterval(()=>document.title=msgs[i++%msgs.length],speed);
  if(b.effect==='pulse') return setInterval(()=>{const m=msgs[i++%msgs.length];document.title=m+' '+'.'.repeat((i%3)+1)},speed);
  if(b.effect==='marquee'){let text=msgs.join('   ✦   ')+'   ';return setInterval(()=>{text=text.slice(1)+text[0];document.title=text.slice(0,28)},Math.max(120,speed/8));}
  const tick=()=>{const m=msgs[i%msgs.length];document.title=m.slice(0,pos);pos+=dir;if(pos>m.length){dir=-1;setTimeout(tick,speed)}else if(pos<0){dir=1;pos=0;i++;setTimeout(tick,350)}else setTimeout(tick,90)};tick();
}
function setupCursor(c){
  const cursors={crosshair:'crosshair',dot:'crosshair',ring:'crosshair',cross:'crosshair',arrow:'default',star:'crosshair'};
  if(c.svg&&c.svg.startsWith('data:image/svg+xml')) document.body.style.cursor=`url("${c.svg}"), auto`; else if(c.image&&c.image!=='system') document.body.style.cursor=cursors[c.image]||'default';
  if(!c.effect||c.effect==='none'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let last=0, hue=190; const glyph={spark:'✦',snow:'❄',hearts:'♥',fire:'✦',magic:'✧',orbit:'◌',matrix:'▪'};
  addEventListener('pointermove',e=>{
    const now=performance.now(); if(now-last<28)return; last=now; hue=(hue+7)%360;
    const p=document.createElement('span');
    if(c.effect==='trail'){p.className='cursor-trail-dot';p.style.color=`hsl(${hue} 90% 65%)`;} else {p.className='cursor-particle';p.textContent=glyph[c.effect]||'✦';p.style.color=`hsl(${hue} 92% 68%)`;p.style.textShadow='0 0 12px currentColor';p.style.fontSize=(c.effect==='matrix'?8:10+Math.random()*8)+'px';}
    p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';document.body.append(p);setTimeout(()=>p.remove(),900);
  },{passive:true});
}
function typewriter(node, text) {
  if (!text) return node.remove();
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return node.textContent = text;
  let i = 0, dir = 1;
  (function tick() {
    node.textContent = text.slice(0, i);
    i += dir;
    let wait = 70;
    if (i > text.length) { dir = -1; wait = 2200; }
    else if (i < 0) { dir = 1; i = 0; wait = 600; }
    setTimeout(tick, wait);
  })();
}

function silenceSiteSoundForSpotify(){
  spotifyPlaying = true;
  if (audio && !audio.paused) audio.pause();
  try{youtubePlayer?.pauseVideo?.()}catch{}
  const video=document.querySelector('#bg video');
  if(video && !video.muted){video.muted=true;video.dataset.spotifyMuted='1'}
}
function getSpotifyIframeApi(){
  if(window.__caruzoSpotifyApi)return Promise.resolve(window.__caruzoSpotifyApi);
  if(spotifyApiPromise)return spotifyApiPromise;
  spotifyApiPromise=new Promise((resolve,reject)=>{
    const previous=window.onSpotifyIframeApiReady;
    window.onSpotifyIframeApiReady=api=>{window.__caruzoSpotifyApi=api;try{previous?.(api)}catch{}resolve(api)};
    if(!document.querySelector('script[data-caruzo-spotify-api]')){
      const sc=document.createElement('script');sc.src='https://open.spotify.com/embed/iframe-api/v1';sc.async=true;sc.dataset.caruzoSpotifyApi='1';sc.onerror=()=>reject(new Error('Spotify API konnte nicht geladen werden'));document.head.append(sc);
    }
    setTimeout(()=>{if(!window.__caruzoSpotifyApi)reject(new Error('Spotify API Timeout'))},7000);
  });
  return spotifyApiPromise;
}
async function setupSpotifyEmbed(shell,kind,id,layout){
  const height=kind==='track'?(layout==='full'?352:152):(layout==='full'?420:352);
  const target=el('div',{class:'spotify-target'});shell.append(target);
  const fallback=()=>{if(target.querySelector('iframe'))return;target.replaceChildren(el('iframe',{src:`https://open.spotify.com/embed/${kind}/${id}?utm_source=generator`,loading:'lazy',allow:'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture',allowfullscreen:'',title:'Spotify'}))};
  try{
    const api=await getSpotifyIframeApi();
    api.createController(target,{uri:`spotify:${kind}:${id}`,width:'100%',height},controller=>{
      controller.addListener('playback_update',e=>{
        const playing=e?.data?.isPaused===false;
        spotifyPlaying=playing;
        if(playing)silenceSiteSoundForSpotify();
      });
    });
    setTimeout(()=>{if(!target.querySelector('iframe'))fallback()},3500);
  }catch{fallback()}
}
let youtubeApiPromise=null,youtubePlayer=null;
function getYouTubeApi(){
  if(window.YT?.Player) return Promise.resolve(window.YT);
  if(youtubeApiPromise) return youtubeApiPromise;
  youtubeApiPromise=new Promise((resolve,reject)=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{try{prev?.()}catch{} resolve(window.YT)};
    if(!document.querySelector('script[data-caruzo-yt-api]')){
      const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;sc.dataset.caruzoYtApi='1';sc.onerror=()=>reject(new Error('YouTube API konnte nicht geladen werden'));document.head.append(sc);
    }
    setTimeout(()=>{if(!window.YT?.Player)reject(new Error('YouTube API Timeout'))},9000);
  });
  return youtubeApiPromise;
}
function renderPremiumSections(u){
  const host=$('#premiumCustom'),list=$('#premiumSectionsList');if(!host||!list)return;
  const sections=u.platform?.premium&&Array.isArray(u.premiumSections)?u.premiumSections:[];
  list.replaceChildren();
  sections.forEach(sec=>{
    const section=el('div',{class:'premium-custom-section'}),title=el('h2',{},sec.title||'Section');section.append(title);
    if(sec.type==='gallery'){
      const images=(Array.isArray(sec.images)?sec.images:[]).filter(Boolean);if(!images.length)return;
      const gallery=el('div',{class:'premium-gallery'});images.forEach(src=>gallery.append(el('a',{href:src,target:'_blank',rel:'noopener noreferrer'},el('img',{src,alt:'',loading:'lazy'}))));section.append(gallery);
    }else{
      const tabs=Array.isArray(sec.tabs)&&sec.tabs.length?sec.tabs:[{label:'About Me',text:sec.text||'',fields:[]}];
      if(!tabs.some(t=>t.text||(Array.isArray(t.fields)&&t.fields.some(f=>f.label||f.value))))return;
      const box=el('div',{class:'premium-tabbed'}),nav=el('div',{class:'premium-tabs'}),panel=el('div',{class:'premium-tab-panel'});
      const show=i=>{[...nav.children].forEach((b,n)=>b.classList.toggle('on',n===i));const tab=tabs[i]||tabs[0];panel.replaceChildren();const fields=(Array.isArray(tab.fields)?tab.fields:[]).filter(f=>f.label||f.value).slice(0,4);if(fields.length){const grid=el('div',{class:'premium-info-grid'});fields.forEach(f=>grid.append(el('div',{class:'premium-info-cell'},el('small',{},f.label||'INFO'),el('b',{},f.value||'—'))));panel.append(grid)}if(tab.text)panel.append(el('div',{class:'premium-tab-copy'},tab.text));};
      tabs.forEach((tab,i)=>{const b=el('button',{class:'premium-tab'+(i===0?' on':''),type:'button'},tab.label||`Tab ${i+1}`);b.onclick=()=>show(i);nav.append(b)});box.append(nav,panel);show(0);section.append(box);
    }
    list.append(section);

}


async function setupMusic(m) {
  const startVolume = Number.isFinite(Number(m.volume)) ? Number(m.volume) : 30;
  const icon = $('#ppIcon');
  $('#player').style.display = 'flex';
  $('#trackName').textContent = m.title || (extractYouTubeId(m.url) ? 'YouTube Audio' : 'Musik');
  $('#vol').value = startVolume;
  const ytId = extractYouTubeId(m.url);
  if(ytId){
    const mount = el('div',{id:'ytAudioMount',hidden:''}); document.body.append(mount);
    try{
      const YT = await getYouTubeApi();
      youtubePlayer = new YT.Player('ytAudioMount', {
        width: '1', height: '1', videoId: ytId,
        playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: ytId, modestbranding: 1, playsinline: 1, rel: 0, start: 0 },
        events: {
          onReady: ev => { try{ev.target.setVolume(startVolume)}catch{} },
          onStateChange: ev => {
            if(ev.data===YT.PlayerState.PLAYING){ if(spotifyPlaying){try{ev.target.pauseVideo()}catch{}; return} icon.setAttribute('d', PATH.pause); }
            if([YT.PlayerState.PAUSED,YT.PlayerState.ENDED,YT.PlayerState.CUED].includes(ev.data)) icon.setAttribute('d', PATH.play);
          }
        }
      });
      $('#vol').oninput = e => { try{youtubePlayer?.setVolume(Number(e.target.value)||0)}catch{} };
      $('#pp').onclick = () => {
        if(spotifyPlaying){toast('Spotify läuft · Hintergrundmusik bleibt pausiert');return}
        try{
          const state=youtubePlayer?.getPlayerState?.();
          if(state===YT.PlayerState.PLAYING) youtubePlayer.pauseVideo(); else youtubePlayer.playVideo();
        }catch{}
      };
      return;
    }catch{}
  }
  audio = new Audio(m.url); audio.loop = true; audio.volume = Math.max(0,Math.min(1,startVolume/100));
  $('#vol').oninput = e => audio.volume = e.target.value / 100;
  $('#pp').onclick = () => { if(spotifyPlaying){toast('Spotify läuft · Hintergrundmusik bleibt pausiert');return} audio.paused ? audio.play() : audio.pause(); };
  audio.onplay = () => { if(spotifyPlaying){audio.pause();return} icon.setAttribute('d', PATH.pause); };
  audio.onpause = () => icon.setAttribute('d', PATH.play);
}

function renderActivity(data) {
  const box = $('#activity'); if (!box) return;
  const acts = Array.isArray(data?.activities) ? data.activities : [];
  // Prefer a game/stream/watch activity. Spotify is used as fallback.
  const primary = acts.find(a => a && a.type !== 4 && String(a.name || '').toLowerCase() !== 'spotify')
    || acts.find(a => a && a.type !== 4);
  if (!primary) { box.hidden = true; box.replaceChildren(); return; }
  const labels = {0:'Spielt gerade',1:'Streamt gerade',2:'Hört gerade',3:'Schaut gerade',5:'Im Wettkampf'};
  const label = labels[primary.type] || 'Aktivität';
  const detail = [primary.details, primary.state].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · ');
  const gamepad = svg('M7 6h10a5 5 0 014.7 6.7l-1.4 4.1a2.3 2.3 0 01-3.7 1l-2.1-1.8h-5l-2.1 1.8a2.3 2.3 0 01-3.7-1l-1.4-4.1A5 5 0 017 6zm1 4H6v2H4v2h2v2h2v-2h2v-2H8v-2zm8.7 1.3a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zm2.6 2.6a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z');
  box.replaceChildren(
    el('div',{class:'activity-icon'},gamepad),
    el('div',{class:'activity-copy'},el('small',{},label),el('b',{},primary.name || 'Discord Activity'),detail?el('span',{},detail):''),
    el('div',{class:'activity-live'},el('i'), 'LIVE')
  );
  box.hidden = false;
}
function applyPresence(data,showStatus=true,showActivity=false){
  const status=String(data?.discord_status||'offline').toLowerCase();
  const [color,label]=STATUS[status]||STATUS.offline;
  document.documentElement.style.setProperty('--st',color);document.querySelector('.avatar')?.style.setProperty('--st',color);
  const st=$('#status');if(showStatus){st.style.display='inline-flex';st.textContent=label;st.dataset.state=status}else st.style.display='none';
  if(showActivity)renderActivity(data);else{const box=$('#activity');if(box){box.hidden=true;box.replaceChildren()}}
}
async function pollStatus(id,showStatus=true,showActivity=false){
  try{const resp=await fetch('/api/presence/'+encodeURIComponent(id)+'?t='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});const r=await resp.json();if(r.success)applyPresence(r.data,showStatus,showActivity)}catch{}
}
function startLanyardPresenceSocket(id,showStatus,showActivity){
  let ws=null,hb=null,retry=null,closed=false;
  const connect=()=>{if(closed)return;try{ws=new WebSocket('wss://api.lanyard.rest/socket')}catch{return schedule()}
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.op===1){clearInterval(hb);const every=Number(m.d?.heartbeat_interval||30000);hb=setInterval(()=>{if(ws?.readyState===1)ws.send(JSON.stringify({op:3}))},every);ws.send(JSON.stringify({op:2,d:{subscribe_to_id:String(id)}}));return}if((m.t==='INIT_STATE'||m.t==='PRESENCE_UPDATE')&&m.d)applyPresence({...m.d,source:'lanyard-live'},showStatus,showActivity)};
    ws.onclose=()=>{clearInterval(hb);hb=null;schedule()};ws.onerror=()=>{try{ws.close()}catch{}};
  };
  const schedule=()=>{if(closed||retry)return;retry=setTimeout(()=>{retry=null;connect()},5000)};connect();
  addEventListener('beforeunload',()=>{closed=true;clearInterval(hb);clearTimeout(retry);try{ws?.close()}catch{}},{once:true});
}
function startPresenceSync(id,showStatus=true,showActivity=false){
  // Single source of truth: our server merges Discord Gateway + Lanyard fallback.
  // Avoid a second browser-side Lanyard socket overwriting a fresher Discord Gateway state.
  applyPresence({discord_status:'offline',activities:[]},showStatus,showActivity);
  pollStatus(id,showStatus,showActivity);
  setInterval(()=>pollStatus(id,showStatus,showActivity),5000);
}
